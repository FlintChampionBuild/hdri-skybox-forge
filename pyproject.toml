[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hdri-skybox-forge"
version = "0.6.2"
description = "AI skybox / HDRI generator — text-to-panorama and cubemap forge for game engines and DCC tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hdri-skybox-forge contributors" }]
keywords = ["hdri", "skybox", "cubemap", "diffusion", "pbr", "game-dev", "exr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3",
  "diffusers>=0.30",
  "transformers>=4.42",
  "safetensors>=0.4.3",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "tomli-w>=1.0",
  "OpenEXR>=3.2 ; platform_system=='Windows'",
  "imageio>=2.34",
  "pyktx2>=0.3 ; extra=='ktx'",
]

[project.optional-dependencies]
cuda = ["torch>=2.3", "xformers>=0.0.27 ; platform_system=='Windows'"]
directml = ["torch-directml>=0.2.0 ; platform_system=='Windows'"]
ktx = ["pyktx2>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
hdri-forge = "hdri_forge.app.cli:main"
hdri-forge-tray = "hdri_forge.app.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hdri_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
files = ["src/hdri_forge/services", "src/hdri_forge/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hdri_forge --cov-report=term-missing"